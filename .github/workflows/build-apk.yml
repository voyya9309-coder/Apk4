          package com.voyya.negocio;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          final class Ajustes {
              private Ajustes() {}

              static SharedPreferences sp(Context c) {
                  return c.getApplicationContext().getSharedPreferences("vy", Context.MODE_PRIVATE);
              }

              static String get(Context c, String k) {
                  return sp(c).getString(k, "");
              }

              static void set(Context c, String k, String v) {
                  sp(c).edit().putString(k, v).apply();
              }

              static String uid(Context c) {
                  return get(c, "uid");
              }

              static boolean activo(Context c) {
                  return uid(c).length() > 0 && "negocio".equals(get(c, "rol"));
              }

              static String ahoraIso() {
                  SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US);
                  f.setTimeZone(TimeZone.getTimeZone("UTC"));
                  return f.format(new Date());
              }

              /** true si es la primera vez que se ve esta clave; guarda las ultimas 80 para no repetir avisos */
              static synchronized boolean marcarVisto(Context c, String k) {
                  String s = get(c, "vistos");
                  if (("," + s + ",").contains("," + k + ",")) return false;
                  s = s.length() == 0 ? k : s + "," + k;
                  String[] p = s.split(",");
                  if (p.length > 80) {
                      StringBuilder b = new StringBuilder();
                      for (int i = p.length - 80; i < p.length; i++) {
                          if (b.length() > 0) b.append(',');
                          b.append(p[i]);
                      }
                      s = b.toString();
                  }
                  set(c, "vistos", s);
                  return true;
              }

              static void iniciarServicio(Context c) {
                  if (!activo(c)) return;
                  try {
                      Intent i = new Intent(c, RealtimeService.class);
                      if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i);
                      else c.startService(i);
                  } catch (Exception ignored) {
                  }
              }

              static void detenerServicio(Context c) {
                  try {
                      c.stopService(new Intent(c, RealtimeService.class));
                  } catch (Exception ignored) {
                  }
              }
          }
