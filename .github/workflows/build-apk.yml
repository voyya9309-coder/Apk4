          package com.voyya.negocio;

          import android.content.Context;
          import android.net.Uri;
          import android.webkit.WebResourceResponse;

          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.util.HashMap;
          import java.util.Map;

          /** Sirve los archivos de la APK (index.html, librerias, sonido) como https://appassets.androidplatform.net/... */
          final class Assets {
              private Assets() {}

              static WebResourceResponse responder(Context c, Uri u) {
                  if (u == null || !Cfg.HOST.equals(u.getHost())) return null;
                  String p = u.getPath();
                  if (p == null || p.equals("/") || p.length() == 0) p = "/index.html";
                  p = p.substring(1);
                  Map<String, String> h = new HashMap<String, String>();
                  h.put("Access-Control-Allow-Origin", "*");
                  try {
                      if (p.contains("..")) throw new java.io.IOException("ruta");
                      InputStream in;
                      String mime;
                      if (p.equals("nuevo_pedido.mp3")) {
                          in = c.getResources().openRawResource(R.raw.nuevo_pedido);
                          mime = "audio/mpeg";
                      } else {
                          in = c.getAssets().open(p);
                          mime = mime(p);
                      }
                      boolean texto = mime.startsWith("text/") || mime.equals("application/javascript") || mime.equals("application/json");
                      WebResourceResponse r = new WebResourceResponse(mime, texto ? "UTF-8" : null, in);
                      r.setResponseHeaders(h);
                      return r;
                  } catch (Exception e) {
                      return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found", h, new ByteArrayInputStream(new byte[0]));
                  }
              }

              private static String mime(String p) {
                  String x = p.toLowerCase();
                  if (x.endsWith(".html")) return "text/html";
                  if (x.endsWith(".js")) return "application/javascript";
                  if (x.endsWith(".css")) return "text/css";
                  if (x.endsWith(".json")) return "application/json";
                  if (x.endsWith(".png")) return "image/png";
                  if (x.endsWith(".jpg") || x.endsWith(".jpeg")) return "image/jpeg";
                  if (x.endsWith(".webp")) return "image/webp";
                  if (x.endsWith(".svg")) return "image/svg+xml";
                  if (x.endsWith(".gif")) return "image/gif";
                  if (x.endsWith(".mp3")) return "audio/mpeg";
                  return "application/octet-stream";
              }
          }
