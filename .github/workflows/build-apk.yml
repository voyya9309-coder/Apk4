name: Compilar APK Negocio

# Sube SOLO estos 3 archivos a la raíz del repositorio (sin zip, sin carpetas):
#   index.html            (tu página)
#   nuevo_pedido.mp3      (tu audio de pedido nuevo)
#   .github/workflows/build-apk.yml   (este archivo)
# El proyecto Android completo se crea solo durante la compilación.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que están tus archivos
        run: |
          test -f index.html || { echo "::error::Falta index.html en la raíz del repositorio"; exit 1; }
          if [ -f nuevo_pedido.mp3 ]; then MP3="nuevo_pedido.mp3"; else MP3="$(ls -- *.mp3 2>/dev/null | head -n 1)"; fi
          test -n "$MP3" || { echo "::error::Falta el audio .mp3 (nuevo_pedido.mp3) en la raíz del repositorio"; exit 1; }
          echo "MP3=$MP3" >> "$GITHUB_ENV"
          echo "index.html: $(wc -c < index.html) bytes · audio: $MP3 ($(wc -c < "$MP3") bytes)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear el proyecto Android
        run: |
          set -e
          mkdir -p android
          cd android
          mkdir -p "app"
          cat > "app/build.gradle" <<'__FIN_VOYYA__'
          plugins {
              id 'com.android.application'
          }

          def verNum = {
              def raw = project.hasProperty('vCode') ? project.property('vCode') : (project.hasProperty('vcCode') ? project.property('vcCode') : null)
              def digits = raw == null ? '' : raw.toString().replaceAll('\\D', '')
              return digits.isEmpty() ? 1 : digits.toInteger()
          }()

          android {
              namespace 'com.voyya.negocio'
              compileSdk 34

              defaultConfig {
                  applicationId "com.voyya.negocio"
                  minSdk 24
                  targetSdk 34
                  versionCode verNum
                  versionName "2.0." + verNum
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('VY_KS') ?: 'voyya-negocio.jks')
                      storePassword System.getenv('VY_KS_PASS') ?: 'voyya2026'
                      keyAlias System.getenv('VY_KS_ALIAS') ?: 'voyya'
                      keyPassword System.getenv('VY_KS_PASS') ?: 'voyya2026'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              packaging {
                  resources {
                      excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module']
                  }
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          __FIN_VOYYA__
          mkdir -p "app"
          cat > "app/proguard-rules.pro" <<'__FIN_VOYYA__'
