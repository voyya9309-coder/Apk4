          package com.voyya.negocio;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int RC_FILE = 11, RC_NOTIF = 12, RC_GEO = 13;

              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private GeolocationPermissions.Callback geoCb;
              private String geoOrigin;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Notifier.canales(this);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setGeolocationEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

                  web.addJavascriptInterface(new Puente(this), "Android");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return Assets.responder(MainActivity.this, r.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if (Cfg.HOST.equals(u.getHost())) return false;
                          abrirExterno(u);
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(p.createIntent(), RC_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              cb.invoke(origin, true, false);
                          } else {
                              geoCb = cb;
                              geoOrigin = origin;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, RC_GEO);
                          }
                      }
                  });

                  web.setDownloadListener(new android.webkit.DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          abrirExterno(Uri.parse(url));
                      }
                  });

                  if (b == null || web.restoreState(b) == null) web.loadUrl("https://" + Cfg.HOST + "/index.html");

                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, RC_NOTIF);
                  }
                  Ajustes.iniciarServicio(this);
              }

              private void abrirExterno(Uri u) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, u));
                  } catch (Exception ignored) {
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle o) {
                  super.onSaveInstanceState(o);
                  if (web != null) web.saveState(o);
              }

              @Override
              protected void onNewIntent(Intent
