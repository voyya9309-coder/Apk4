          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoyYaNegocio"
          include ':app'
          __FIN_VOYYA__

      - name: Meter la página, librerías y estilos DENTRO de la APK
        run: |
          set -e
          A="$GITHUB_WORKSPACE/android/app/src/main/assets"
          mkdir -p "$A/images" "$GITHUB_WORKSPACE/android/app/src/main/res/raw"
          cp "$GITHUB_WORKSPACE/$MP3" "$GITHUB_WORKSPACE/android/app/src/main/res/raw/nuevo_pedido.mp3"
          dl() {
            for i in 1 2 3 4; do
              if curl -fsSL --retry 2 -o "$2" "$1" && [ -s "$2" ]; then return 0; fi
              sleep 3
            done
            echo "::error::No se pudo descargar $1"; return 1
          }
          dl https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js "$A/supabase.js"
          dl https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js "$A/lucide.js"
          dl https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js "$A/leaflet.js"
          dl https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css "$A/leaflet.css"
          for im in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do
            dl "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/$im" "$A/images/$im"
          done
          # Estilos (Tailwind) compilados una sola vez: pesan ~30 KB en vez de cargar 300 KB desde internet
          mkdir -p /tmp/tw && cd /tmp/tw
          npm install --no-save --no-audit --no-fund tailwindcss@3.4.17
          printf '%s' "module.exports={content:['$GITHUB_WORKSPACE/index.html'],theme:{extend:{colors:{v:'var(--v)',vt:'var(--vt)',s:'var(--s)',ink:'var(--ink)',hd:'var(--hd)'}}}};" > tw.config.js
          echo '@tailwind base;@tailwind components;@tailwind utilities;' > in.css
          npx tailwindcss -c tw.config.js -i in.css -o "$A/tw.css" --minify
          test -s "$A/tw.css"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'__FIN_VOYYA__'
          import os
          s = open('index.html', encoding='utf-8').read()
          reps = [
            ('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">', '<link rel="stylesheet" href="leaflet.css">'),
            ('<script src="https://cdn.tailwindcss.com/3.4.17"></script>', '<link rel="stylesheet" href="tw.css">'),
            ('<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>', '<script src="lucide.js"></script>'),
            ('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>', '<script src="leaflet.js"></script>'),
            ('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>', '<script src="supabase.js"></script>'),
            ("<script>tailwind.config={theme:{extend:{colors:{v:'var(--v)',vt:'var(--vt)',s:'var(--s)',ink:'var(--ink)',hd:'var(--hd)'}}}}</script>", ''),
          ]
          for a, b in reps:
              if a not in s:
                  raise SystemExit('::error::No encontré esta línea en index.html (¿la cambiaste?): ' + a[:90])
              s = s.replace(a, b)
          out = os.environ['GITHUB_WORKSPACE'] + '/android/app/src/main/assets/index.html'
          open(out, 'w', encoding='utf-8').write(s)
          print('index.html listo para la APK:', len(s), 'bytes')
          __FIN_VOYYA__
          ls -l "$A"

      - name: Preparar Android SDK (ya viene instalado en GitHub)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firma de la APK
        run: |
          set -e
          cd android/app
          if [ -f "$GITHUB_WORKSPACE/voyya-negocio.jks" ]; then
            cp "$GITHUB_WORKSPACE/voyya-negocio.jks" voyya-negocio.jks
            echo "Usando tu firma guardada (voyya-negocio.jks): la APK se instala encima de la anterior."
          else
            keytool -genkeypair -keystore voyya-negocio.jks -alias voyya -keyalg RSA -keysize 2048 -validity 36500 -storepass voyya2026 -keypass voyya2026 -dname "CN=VoyYa Negocio, O=VoyYa, C=CU"
            echo "NUEVA_FIRMA=1" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK firmado
        working-directory: android
        env:
          VY_KS: ${{ github.workspace }}/android/app/voyya-negocio.jks
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Comprobar contenido y tamaño de la APK
        run: |
          set -e
          mkdir -p salida
          cp android/app/build/outputs/apk/release/*.apk salida/VoyYa-Negocio.apk
          APK=salida/VoyYa-Negocio.apk
          {
            echo "### APK de negocio"
            echo "Tamaño: **$(du -h "$APK" | cut -f1)** ($(wc -c < "$APK") bytes)"
            echo '```'
            unzip -l "$APK" | grep -E "assets/|res/raw|classes|\.webp" | awk '{print $1" bytes  "$4}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in assets/index.html assets/supabase.js assets/lucide.js assets/leaflet.js assets/leaflet.css assets/tw.css; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::Falta $f dentro de la APK"; exit 1; }
          done
          if [ -n "$NUEVA_FIRMA" ]; then cp android/app/voyya-negocio.jks salida/voyya-negocio.jks; fi

      - uses: actions/upload-artifact@v4
        with:
          name: VoyYa-Negocio-APK
          path: salida/VoyYa-Negocio.apk

      - name: Firma nueva (guárdala en el repositorio)
        if: env.NUEVA_FIRMA == '1'
        uses: actions/upload-artifact@v4
        with:
          name: FIRMA-voyya-negocio-jks
          path: salida/voyya-negocio.jks
