          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;
          import okhttp3.WebSocket;
          import okhttp3.WebSocketListener;

          /**
           * Mantiene la conexion en tiempo real (Supabase Realtime) aunque la app este cerrada
           * y lanza la notificacion de pedido nuevo / aviso del administrador.
           */
          public class RealtimeService extends Service {
              static volatile boolean corriendo = false;

              private static final String TOPIC = "realtime:vy-negocio";

              private final Handler h = new Handler(Looper.getMainLooper());
              private final ExecutorService ex = Executors.newSingleThreadExecutor();
              private final ExecutorService red = Executors.newFixedThreadPool(2);

              private OkHttpClient http;
              private WebSocket ws;
              private PowerManager.WakeLock wl;
              private ConnectivityManager cm;
              private ConnectivityManager.NetworkCallback netCb;

              private volatile int gen = 0;
              private volatile boolean conectando = false;
              private volatile boolean detenido = false;
              private volatile long ultimoMsg = 0;
              private int intentos = 0;
              private int refN = 1;
              private List<String> negocios = new ArrayList<String>();

              private final Runnable reconectarR = new Runnable() {
                  @Override
                  public void run() {
                      if (detenido || ws != null || conectando) return;
                      conectarAhora();
                  }
              };

              private final Runnable latido = new Runnable() {
                  @Override
                  public void run() {
                      if (detenido) return;
                      WebSocket w = ws;
                      if (w != null) {
                          if (System.currentTimeMillis() - ultimoMsg > 75000) {
                              reconectar();
                          } else {
                              w.send("{\"topic\":\"phoenix\",\"event\":\"heartbeat\",\"payload\":{},\"ref\":\"" + (++refN) + "\"}");
                          }
                      }
                      h.postDelayed(this, 25000);
                  }
              };

              private final Runnable refrescarNegocios = new Runnable() {
                  @Override
                  public void run() {
                      if (detenido) return;
                      ex.execute(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  List<String> n = cargarNegocios();
                                  if (!n.equals(negocios)) {
                                      h.post(new Runnable() {
                                          @Override
                                          public void run() {
                                              reconectar();
                                          }
                                      });
                                  }
                              } catch (Exception ignored) {
                              }
                          }
                      });
                      h.postDelayed(this, 10 * 60000L);
                  }
              };

              @Override
              public void onCreate() {
                  super.onCreate();
                  Notifier.canales(this);
                  http = new OkHttpClient.Builder()
                          .pingInterval(25, TimeUnit.SECONDS)
                          .readTimeout(0, TimeUnit.MILLISECONDS)
                          .connectTimeout(15, TimeUnit.SECONDS)
                          .build();
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "voyya:realtime");
                      wl.setReferenceCounted(false);
                      wl.acquire();
                  } catch (Exception ignored) {
                  }
                  try {
                      cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      netCb = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onAvailable(Network network) {
                              h.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (!detenido && ws == null) {
                                          intentos = 0;
                                          h.removeCallbacks(reconectarR);
                                          h.post(reconectarR);
                                      }
                                  }
                              });
                          }
                      };
                      cm.registerDefaultNetworkCallback(netCb);
                  } catch (Exception ignored) {
                  }
                  h.postDelayed(latido, 25000);
                  h.postDelayed(refrescarNegocios, 10 * 60000L);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Notification n = Notifier.servicio(this);
                  if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC);
                  else startForeground(1, n);

                  if (!Ajustes.activo(this)) {
                      detenido = true;
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  detenido = false;
                  corriendo = true;
                  if (ws == null && !conectando) conectarAhora();
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onDestroy() {
                  detenido = true;
                  corriendo = false;
                  gen++;
                  h.removeCallbacksAndMessages(null);
                  if (ws != null) {
                      try {
                          ws.cancel();
                      } catch (Exception ignored) {
                      }
                      ws = null;
                  }
                  try {
                      if (cm != null && netCb != null) cm.unregisterNetworkCallback(netCb);
                  } catch (Exception ignored) {
                  }
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception ignored) {
                  }
                  ex.shutdownNow();
                  red.shutdownNow();
                  super.onDestroy();
              }

              // ---------------------------------------------------------------- conexion

              private List<String> cargarNegocios() throws Exception {
                  List<String> r = new ArrayList<String>();
                  JSONArray a = new JSONArray(Net.rest("negocios?dueno_id=eq." + Ajustes.uid(this) + "&select=id"));
                  for (int i = 0; i < a.length(); i++) {
                      String id = a.getJSONObject(i).optString("id");
                      if (id.matches("[0-9a-fA-F-]{8,64}")) r.add(id);
                  }
                  return r;
              }

              private void conectarAhora() {
                  if (detenido || !Ajustes.activo(this) || conectando) return;
                  conectando = true;
                  final int g = ++gen;
                  ex.execute(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              List<String> negs = cargarNegocios();
                              if (g != gen || detenido) return;
                              negocios = negs;
                              recuperarPerdidos(negs);
                              abrirWs(g, negs);
                          } catch (Exception e) {
                              if (g == gen) {
                                  h.post(new Runnable() {
                                      @Override
                                      public void run() {
                                          conectando = false;
                                          reconectar();
                                      }
                                  });
                              }
                          }
                      }
                  });
              }

              private void abrirWs(final int g, final List<String> negs) {
                  String url = Cfg.WS + "?apikey=" + Cfg.KEY + "&vsn=1.0.0";
                  Request r = new Request.Builder().url(url).build();
                  ws = http.newWebSocket(r, new WebSocketListener() {
                      @Override
                      public void onOpen(WebSocket w, Response resp) {
                          if (g != gen) {
                              w.close(1000, null);
                              return;
                          }
                          conectando = false;
                          intentos = 0;
                          ultimoMsg = System.currentTimeMillis();
                          w.send(mensajeUnirse(negs));
                      }

                      @Override
                      public void onMessage(WebSocket w, String t) {
                          if (g != gen) return;
                          ultimoMsg = System.currentTimeMillis();
                          procesar(t);
                      }

                      @Override
                      public void onClosing(WebSocket w, int code, String reason) {
                          w.close(1000, null);
                      }

                      @Override
                      public void onClosed(WebSocket w, int code, String reason) {
                          if (g == gen) h.post(new Runnable() {
                              @Override
                              public void run() {
                                  reconectar();
                              }
                          });
                      }

                      @Override
                      public void onFailure(WebSocket w, Throwable t, Response resp) {
                          if (g == gen) h.post(new Runnable() {
                              @Override
                              public void run() {
                                  conectando = false;
                                  reconectar();
                              }
                          });
                      }
                  });
              }

              private String mensajeUnirse(List<String> negs) {
                  try {
                      JSONArray pc = new JSONArray();
                      for (String n : negs) {
                          pc.put(new JSONObject().put("event", "INSERT").put("schema", "public").put("table", "pedidos").put("filter", "negocio_id=eq." + n));
                      }
                      pc.put(new JSONObject().put("event", "INSERT").put("schema", "public").put("table", "push"));
                      JSONObject cfg = new JSONObject()
                              .put("broadcast", new JSONObject().put("ack", false).put("self", false))
                              .put("presence", new JSONObject().put("key", ""))
                              .put("postgres_changes", pc)
                              .put("private", false);
                      JSONObject m = new JSONObject()
                              .put("topic", TOPIC)
                              .put("event", "phx_join")
                              .put("payload", new JSONObject().put("config", cfg))
                              .put("ref", "1")
                              .put("join_ref", "1");
                      return m.toString();
                  } catch (Exception e) {
                      return "{}";
                  }
              }

              private void reconectar() {
                  if (detenido) return;
                  gen++;
                  if (ws != null) {
                      try {
                          ws.cancel();
                      } catch (Exception ignored) {
                      }
                      ws = null;
                  }
                  conectando = false;
                  long d = Math.min(30000L, 1000L * (1L << Math.min(intentos, 5)));
                  intentos++;
                  h.removeCallbacks(reconectarR);
                  h.postDelayed(reconectarR, d);
              }

              // ---------------------------------------------------------------- mensajes

              private void procesar(String t) {
                  try {
                      JSONObject o = new JSONObject(t);
                      String ev = o.optString("event");
                      if ("postgres_changes".equals(ev)) {
                          JSONObject d = o.getJSONObject("payload").getJSONObject("data");
                          if (!"INSERT".equals(d.optString("type"))) return;
                          JSONObject rec = d.optJSONObject("record");
                          if (rec == null) return;
                          String tabla = d.optString("table");
                          if ("pedidos".equals(tabla)) nuevoPedido(rec);
                          else if ("push".equals(tabla)) nuevoAviso(rec);
                      } else if ("phx_error".equals(ev) || "phx_close".equals(ev)) {
                          if (TOPIC.equals(o.optString("topic"))) {
                              h.post(new Runnable() {
                                  @Override
                                  public void run() {
                                      reconectar();
                                  }
                              });
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void recuperarPerdidos(List<String> negs) {
                  // Si la conexion estuvo caida, pide lo que llego mientras tanto
                  try {
                      String ultP = Ajustes.get(this, "last_pedido");
                      if (ultP.length() == 0) {
                          Ajustes.set(this, "last_pedido", Ajustes.ahoraIso());
                      } else if (!negs.isEmpty()) {
                          StringBuilder ids = new StringBuilder();
                          for (String n : negs) {
                              if (ids.length() > 0) ids.append(',');
                              ids.append(n);
                          }
                          JSONArray a = new JSONArray(Net.rest("pedidos?negocio_id=in.(" + ids + ")&creado=gt." + Net.enc(ultP)
                                  + "&select=id,cliente_nombre,total,items,metodo_pago,creado&order=creado.asc&limit=20"));
                          for (int i = 0; i < a.length(); i++) nuevoPedido(a.getJSONObject(i));
                      }
                  } catch (Exception ignored) {
                  }
                  try {
                      String ultA = Ajustes.get(this, "last_push");
                      if (ultA.length() == 0) {
                          Ajustes.set(this, "last_push", Ajustes.ahoraIso());
                      } else {
                          JSONArray a = new JSONArray(Net.rest("push?creado=gt." + Net.enc(ultA)
                                  + "&select=id,titulo,mensaje,foto_url,audio_url,usuarios,creado&order=creado.asc&limit=20"));
                          for (int i = 0; i < a.length(); i++) nuevoAviso(a.getJSONObject(i));
                      }
                  } catch (Exception ignored) {
                  }
              }

              private static String num(double v) {
                  if (v == Math.rint(v)) return String.valueOf((long) v);
                  return String.format(Locale.US, "%.2f", v);
              }

              private void nuevoPedido(JSONObject o) {
                  String id = o.optString("id");
                  if (id.length() == 0) return;
                  String creado = o.optString("creado");
                  if (creado.length() > 0 && creado.compareTo(Ajustes.get(this, "last_pedido")) > 0) Ajustes.set(this, "last_pedido", creado);
                  if (!Ajustes.marcarVisto(this, "p" + id)) return;

                  String cli = o.optString("cliente_nombre", "Cliente");
                  if (cli.length() == 0 || "null".equals(cli)) cli = "Cliente";
                  String total = num(o.optDouble("total", 0));
                  String met = o.optString("metodo_pago", "");
                  met = "transferencia".equals(met) ? "💳 Transferencia" : ("efectivo".equals(met) ? "💵 Efectivo" : "");

                  StringBuilder it = new StringBuilder();
                  try {
                      Object raw = o.opt("items");
                      JSONArray a = null;
                      if (raw instanceof JSONArray) a = (JSONArray) raw;
                      else if (raw instanceof String) a = new JSONArray((String) raw);
                      if (a != null) {
                          for (int i = 0; i < a.length() && i < 12; i++) {
                              JSONObject p = a.optJSONObject(i);
                              if (p == null) continue;
                              if (it.length() > 0) it.append('\n');
                              it.append(p.optInt("q", 1)).append("× ").append(p.optString("n", "Producto"));
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  Notifier.pedido(this, id, cli, total, it.toString(), met);
              }

              private void nuevoAviso(JSONObject o) {
                  final String id = o.optString("id");
                  if (id.length() == 0) return;
                  String creado = o.optString("creado");
                  if (creado.length() > 0 && creado.compareTo(Ajustes.get(this, "last_push")) > 0) Ajustes.set(this, "last_push", creado);

                  // usuarios == null -> para todos; si trae lista, solo si me incluye
                  Object us = o.opt("usuarios");
                  boolean paraMi = us == null || us == JSONObject.NULL;
                  if (!paraMi) {
                      String yo = Ajustes.uid(this);
                      if (us instanceof JSONArray) {
                          JSONArray ua = (JSONArray) us;
                          for (int i = 0; i < ua.length(); i++) if (yo.equals(ua.optString(i))) paraMi = true;
                      } else {
                          paraMi = us.toString().contains(yo);
                      }
                  }
                  if (!paraMi) return;
                  if (!Ajustes.marcarVisto(this, "a" + id)) return;

                  final String titulo = o.optString("titulo", "");
                  final String mensaje = o.optString("mensaje", "");
                  final String foto = nulo(o.optString("foto_url", ""));
                  final String audio = nulo(o.optString("audio_url", ""));
                  final Context c = this;
                  red.execute(new Runnable() {
                      @Override
                      public void run() {
                          android.graphics.Bitmap bmp = foto.length() > 0 ? Net.bitmap(foto, 800) : null;
                          Notifier.aviso(c, id, "null".equals(titulo) ? "" : titulo, "null".equals(mensaje) ? "" : mensaje, foto, audio, bmp);
                      }
                  });
              }

              private static String nulo(String s) {
                  return "null".equals(s) ? "" : s;
              }
          }
