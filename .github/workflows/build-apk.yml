                      geoCb = null;
                  }
                  super.onRequestPermissionsResult(req, perms, results);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
