          package com.voyya.negocio;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;

          final class Net {
              private Net() {}

              static String enc(String s) {
                  try {
                      return URLEncoder.encode(s, "UTF-8");
                  } catch (Exception e) {
                      return s;
                  }
              }

              /** GET a la API REST de Supabase (solo lectura, con la clave publica) */
              static String rest(String rutaYConsulta) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(Cfg.URL + "/rest/v1/" + rutaYConsulta).openConnection();
                  try {
                      c.setConnectTimeout(10000);
                      c.setReadTimeout(15000);
                      c.setRequestProperty("apikey", Cfg.KEY);
                      c.setRequestProperty("Accept", "application/json");
                      int code = c.getResponseCode();
                      if (code != 200) throw new IOException("HTTP " + code);
                      return new String(leer(c.getInputStream(), 2 * 1024 * 1024), "UTF-8");
                  } finally {
                      c.disconnect();
                  }
              }

              static byte[] leer(InputStream in, int max) throws IOException {
                  try {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) {
                          o.write(b, 0, n);
                          if (o.size() > max) throw new IOException("demasiado grande");
                      }
                      return o.toByteArray();
                  } finally {
                      try {
                          in.close();
                      } catch (Exception ignored) {
                      }
                  }
              }

              /** Descarga una imagen reduciendola para no gastar memoria */
              static Bitmap bitmap(String url, int maxLado) {
                  if (url == null || url.length() == 0) return null;
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(12000);
                      byte[] d = leer(c.getInputStream(), 8 * 1024 * 1024);
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeByteArray(d, 0, d.length, o);
                      int s = 1;
                      while (Math.max(o.outWidth, o.outHeight) / s > maxLado) s *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = s;
                      return BitmapFactory.decodeByteArray(d, 0, d.length, o2);
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }
          }
