          package com.voyya.negocio;

          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          /** Pantalla que se abre al tocar un aviso: muestra la foto y deja escuchar el audio SOLO cuando tu lo pulsas */
          public class AvisoActivity extends Activity {
              private MediaPlayer mp;
              private Button btnAudio;
              private String audioUrl = "";

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Intent in = getIntent();
                  String titulo = in.getStringExtra("titulo");
                  String mensaje = in.getStringExtra("mensaje");
                  String foto = in.getStringExtra("foto");
                  audioUrl = in.getStringExtra("audio") == null ? "" : in.getStringExtra("audio");
                  int nid = in.getIntExtra("nid", 0);

                  try {
                      ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).cancel(nid);
                  } catch (Exception ignored) {
                  }

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#FFF8E1"));
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(18), dp(28), dp(18), dp(24));
                  sv.addView(col);

                  TextView t = new TextView(this);
                  t.setText(titulo == null || titulo.length() == 0 ? "VoyYa" : titulo);
                  t.setTextSize(22);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setTextColor(Color.parseColor("#1A1A1A"));
                  col.addView(t);

                  if (mensaje != null && mensaje.length() > 0) {
                      TextView m = new TextView(this);
                      m.setText(mensaje);
                      m.setTextSize(17);
                      m.setTextColor(Color.parseColor("#1A1A1A"));
                      m.setPadding(0, dp(10), 0, dp(10));
                      m.setTextIsSelectable(true);
                      col.addView(m);
                  }

                  if (foto != null && foto.length() > 0) {
                      final ImageView iv = new ImageView(this);
                      iv.setAdjustViewBounds(true);
                      iv.setScaleType(ImageView.ScaleType.FIT_CENTER);
                      iv.setPadding(0, dp(8), 0, dp(8));
                      col.addView(iv, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                      final String url = foto;
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              final Bitmap bm = Net.bitmap(url, 1600);
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (bm != null && !isFinishing()) iv.setImageBitmap(bm);
                                  }
                              });
                          }
                      }).start();
                  }

                  if (audioUrl.length() > 0) {
                      btnAudio = boton("▶ Escuchar audio", "#FFC400", "#1A1A1A");
                      btnAudio.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) {
                              alternarAudio();
                          }
                      });
                      col.addView(btnAudio, params());
                  }

                  Button abrir = boton("Abrir VoyYa", "#1A1A1A", "#FFFFFF");
                  abrir.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent i = new Intent(AvisoActivity.this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                          startActivity(i);
                          finish();
                      }
                  });
                  col.addView(abrir, params());

                  Button cerrar = boton("Cerrar", "#E5E5E5", "#1A1A1A");
                  cerrar.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          finish();
                      }
                  });
                  col.addView(cerrar, params());

                  setContentView(sv);
              }

              private LinearLayout.LayoutParams params() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(52));
                  p.topMargin = dp(10);
                  return p;
              }

              private Button boton(String texto, String fondo, String color) {
                  Button b = new Button(this);
                  b.setText(texto);
                  b.setAllCaps(false);
                  b.setTextSize(16);
                  b.setTypeface(Typeface.DEFAULT_BOLD);
                  b.setTextColor(Color.parseColor(color));
                  b.setBackgroundColor(Color.parseColor(fondo));
                  b.setGravity(Gravity.CENTER);
                  return b;
              }

              private void alternarAudio() {
                  try {
                      if (mp == null) {
                          btnAudio.setText("⏳ Cargando audio…");
                          btnAudio.setEnabled(false);
                          mp = new MediaPlayer();
                          mp.setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build());
                          mp.setDataSource(audioUrl);
                          mp.setOnPreparedListener(new MediaPlayer.OnPreparedListener() {
                              @Override
                              public void onPrepared(MediaPlayer m) {
                                  btnAudio.setEnabled(true);
                                  m.start();
                                  btnAudio.setText("⏸ Pausar audio");
                              }
                          });
                          mp.setOnCompletionListener(new MediaPlayer.OnCompletionListener() {
                              @Override
                              public void onCompletion(MediaPlayer m) {
                                  btnAudio.setText("▶ Escuchar de nuevo");
                              }
                          });
                          mp.setOnErrorListener(new MediaPlayer.OnErrorListener() {
                              @Override
                              public boolean onError(MediaPlayer m, int what, int extra) {
                                  btnAudio.setEnabled(true);
                                  btnAudio.setText("No se pudo reproducir · toca para reintentar");
                                  liberar();
                                  return true;
                              }
                          });
                          mp.prepareAsync();
                      } else if (mp.isPlaying()) {
                          mp.pause();
                          btnAudio.setText("▶ Continuar audio");
                      } else {
                          mp.start();
                          btnAudio.setText("⏸ Pausar audio");
                      }
                  } catch (Exception e) {
                      btnAudio.setEnabled(true);
                      btnAudio.setText("No se pudo reproducir · toca para reintentar");
                      liberar();
                  }
              }

              private void liberar() {
                  if (mp != null) {
                      try {
                          mp.release();
                      } catch (Exception ignored) {
                      }
                      mp = null;
                  }
              }

              @Override
              protected void onStop() {
                  if (mp != null && mp.isPlaying()) {
                      mp.pause();
                      if (btnAudio != null) btnAudio.setText("▶ Continuar audio");
                  }
                  super.onStop();
              }

              @Override
              protected void onDestroy() {
                  liberar();
                  super.onDestroy();
              }
          }
