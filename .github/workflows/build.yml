name: Compilar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: unzip -q VoyYaNegocio-proyecto-android.zip
      - run: cd VoyYaNegocio && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoyYa-Negocio-APK
          path: VoyYaNegocio/app/build/outputs/apk/debug/app-debug.apk
