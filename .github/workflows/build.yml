name: Compilar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceptar licencias de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar proyecto
        run: |
          ls -la
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then unzip -q "$Z"; fi
          S=$(find . -name settings.gradle | head -1)
          if [ -z "$S" ]; then echo "NO ENCONTRE EL PROYECTO: sube el zip a la raiz del repositorio"; exit 1; fi
          echo "PROYECTO=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Compilar
        run: cd "$PROYECTO" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoyYa-Negocio-APK
          path: ${{ env.PROYECTO }}/app/build/outputs/apk/debug/app-debug.apk
