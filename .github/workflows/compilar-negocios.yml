name: Compilar APK Negocio

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto desde ZIP o carpeta
        id: prep_project
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p /tmp/voyya_src
              unzip -q "$ZIP_FILE" -d /tmp/voyya_src
              PROJECT_FILE=$(find /tmp/voyya_src -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
            else
              PROJECT_FILE=$(find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
            fi
          else
            PROJECT_FILE="./settings.gradle"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle ni archivo .zip del proyecto."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto listo en: $PROJECT_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$ANDROID_HOME/licenses/google-gdk-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK firmado
        working-directory: ${{ steps.prep_project.outputs.project_dir }}
        run: gradle assembleRelease --no-daemon

      - name: Copiar APK a ruta conocida
        run: |
          mkdir -p /tmp/apk_out
          cp ${{ steps.prep_project.outputs.project_dir }}/app/build/outputs/apk/release/*.apk /tmp/apk_out/

      - uses: actions/upload-artifact@v4
        with:
          name: VoyYa-Negocio-APK
          path: /tmp/apk_out/*.apk
